<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSS Packing Calculator</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --ink: #1c2733;
    --muted: #64748b;
    --line: #dde3ea;
    --accent: #1f6feb;
    --accent-soft: #e7f0fe;
    --good: #0a7f4f;
    --warn-bg: #fff7e0;
    --warn-ink: #8a6100;
    --danger: #c0392b;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.45;
  }
  .shell { display: flex; gap: 20px; align-items: flex-start; max-width: 1160px; margin: 0 auto; padding: 24px 16px 60px; }
  .wrap { flex: 1; min-width: 0; max-width: 880px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  header h1 { font-size: 22px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  button { font: inherit; cursor: pointer; }

  /* Tab bar. Item tabs wrap inside their own area and Order Total stays pinned
     top right, so a second row of tabs can never strand it on a line of its own.
     Tabs are separate pills, not folder tabs joined to the panel: with two rows
     only one row can touch the panel, and the joined look pointed at the wrong tab. */
  .tabs { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 10px; }
  .tablist { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .tab {
    display: inline-flex; align-items: center; gap: 8px;
    background: #e9edf2; border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; color: var(--muted);
    user-select: none; cursor: pointer; max-width: 220px;
  }
  .tab:hover { background: #e1e6ed; }
  .tab.active { background: var(--panel); color: var(--ink); font-weight: 600; border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .tab .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab.active .name { cursor: text; }
  .tab .close { border: none; background: none; color: var(--muted); font-size: 14px; line-height: 1; padding: 2px; border-radius: 4px; }
  .tab .close:hover { color: var(--danger); background: #f3d6d2; }
  .tab input.rename { font: inherit; font-weight: 600; border: 1px solid var(--accent); border-radius: 4px; padding: 1px 4px; width: 110px; }
  .tab.total-tab { flex: none; background: var(--accent-soft); color: var(--accent); font-weight: 600; border-color: #bcd4f8; }
  .tab.total-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: none; }
  .addtab { border: 1px dashed #b9c3cf; background: none; color: var(--accent); border-radius: 8px; padding: 7px 12px; }
  .addtab:hover { background: var(--accent-soft); }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px;
  }

  /* Form */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px 18px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .field input[type="number"], .field input[type="text"], .field select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; background: #fbfcfe;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: none; background: #fbfcfe; padding: 8px 14px; color: var(--muted); }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
  /* Fields in one line share three rows (label, box, hint) through a subgrid, so
     every box lines up even when one label wraps onto two lines in a narrow window. */
  .row.nowrap { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);
                grid-template-rows: auto auto auto; gap: 0 18px; }
  .row.nowrap > .field { display: grid; grid-row: span 3; grid-template-rows: subgrid; min-width: 0; }
  /* on a phone or a narrow app window they wrap, still lined up line by line */
  @media (max-width: 760px) {
    .row.nowrap { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .row.nowrap > .field { margin-bottom: 14px; }
  }
  .divider { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  /* iPhone-style on/off switch */
  .sw { position: relative; flex: none; width: 51px; height: 31px; padding: 0; border: none; align-self: center;
        border-radius: 999px; background: #d9dde3; transition: background .18s ease; }
  .sw.on { background: #34c759; }
  .sw span { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
             background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.28); transition: transform .18s ease; }
  .sw.on span { transform: translateX(20px); }
  .sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Results */
  .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 6px; }
  .stat { background: #f8fafc; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .stat .k { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat .v { font-size: 24px; font-weight: 700; margin-top: 2px; }
  .stat.primary { background: var(--accent-soft); border-color: #bcd4f8; }
  .stat.primary .v { color: var(--accent); }
  .stat .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .warning { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid #eedb9a; border-radius: 8px; padding: 8px 12px; margin: 10px 0 0; font-size: 13.5px; }

  /* uneven-cases question */
  .ask { background: var(--warn-bg); border: 1px solid #eedb9a; border-radius: var(--radius); padding: 12px 14px; margin-bottom: 4px; }
  .ask-q { font-weight: 700; color: var(--warn-ink); }
  .ask-why { font-size: 13px; color: var(--warn-ink); opacity: .85; margin: 2px 0 10px; }
  .ask-row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
  .ask-note { font-size: 13px; color: var(--warn-ink); flex: 1; min-width: 180px; padding-bottom: 8px; }
  .ask .field { min-width: 160px; }
  .ask .field label { color: var(--warn-ink); }

  /* boxing options */
  .boxes { margin-top: 14px; }
  .boxes-h { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .boxopt { display: flex; justify-content: space-between; align-items: center; gap: 14px;
    border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 6px; background: #f8fafc; }
  .boxopt[onclick] { cursor: pointer; }
  .boxopt.on { border-color: var(--accent); background: var(--accent-soft); }
  .boxopt-l { display: flex; gap: 10px; align-items: center; }
  .radio { color: var(--accent); font-size: 15px; }
  .boxopt-n { font-size: 14px; }
  .boxopt-d { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .boxopt-c { font-size: 19px; font-weight: 700; text-align: right; white-space: nowrap; }
  .boxopt-pc { font-size: 12px; font-weight: 400; color: var(--muted); }
  .extra { color: var(--warn-ink); background: var(--warn-bg); border-radius: 4px; padding: 0 5px; font-size: 12.5px; }

  /* show-your-work */
  details.work { margin-top: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: #fbfcfe; padding: 10px 14px; }
  details.work summary { cursor: pointer; font-weight: 600; color: var(--ink); user-select: none;
    list-style: none; display: inline-flex; align-items: center; gap: 6px; }
  details.work summary::before { content: "▸"; color: var(--accent); transition: transform .15s; }
  details.work[open] summary::before { transform: rotate(90deg); }
  .worktbl { width: 100%; border-collapse: collapse; margin-top: 8px; table-layout: auto; }
  /* the shared th/td rule sets nowrap, which would force this table wider than
     the panel and push the money column out of sight — only the short cells keep it */
  .worktbl td { border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: baseline; white-space: normal; }
  .worktbl .wl { font-weight: 600; white-space: nowrap; width: 1%; }
  .worktbl .wc { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 13px; text-align: left; }
  .worktbl .wv { text-align: right; font-weight: 600; white-space: nowrap; width: 1%; }
  .worktbl .wn td { border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12.5px; font-style: italic; padding-top: 0; }
  .worktbl .wtot td { border-bottom: none; border-top: 2px solid var(--ink); font-size: 17px; padding-top: 8px; }
  .worktbl .wtot .wv { color: var(--accent); font-weight: 800; }
  .worksub { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 16px; }
  .incomplete { color: var(--muted); font-style: italic; padding: 14px 0 4px; }

  /* Comparison */
  details.compare { margin-top: 20px; }
  details.compare summary {
    cursor: pointer; font-weight: 600; color: var(--accent); user-select: none;
    list-style: none; display: inline-flex; align-items: center; gap: 6px;
  }
  details.compare summary::before { content: "▸"; transition: transform .15s; }
  details.compare[open] summary::before { transform: rotate(90deg); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 4px 10px; font-weight: 600; font-size: 13px; }
  .chip button { border: none; background: none; color: inherit; padding: 0; font-size: 13px; }
  .chip button:hover { color: var(--danger); }
  .chips input { width: 64px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  .chips .add { border: none; background: var(--accent); color: #fff; border-radius: 8px; padding: 6px 12px; font-weight: 600; }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 2px solid var(--line); }
  .cur { background: var(--accent-soft); }
  .best { color: var(--good); font-weight: 700; }
  .tablewrap { overflow-x: auto; }

  /* Order total */
  .grand { display: flex; justify-content: flex-end; align-items: baseline; gap: 14px; margin-top: 16px; padding-top: 14px; border-top: 2px solid var(--ink); }
  .grand .label { font-weight: 600; color: var(--muted); }
  .grand .amount { font-size: 30px; font-weight: 800; color: var(--accent); }
  .flag { color: var(--warn-ink); font-style: italic; font-size: 13px; text-align: left; }
  .clear { border: 1px solid var(--line); background: var(--panel); color: var(--danger); border-radius: 8px; padding: 7px 12px; font-size: 13px; }
  .clear:hover { background: #fdf1ef; }
  .muted { color: var(--muted); }
  /* order list */
  .side { width: 230px; flex: none; position: sticky; top: 16px; max-height: calc(100vh - 32px);
          display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .side-h { padding: 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .side-title { font-weight: 700; }
  .side-toggle { display: none; border: none; background: none; font-weight: 700; text-align: left; padding: 0; color: var(--ink); }
  .newbtn { border: none; background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 10px; font-weight: 600; }
  .olist { overflow-y: auto; flex: 1; padding: 6px; }
  .orow { position: relative; padding: 8px 52px 8px 10px; border-radius: 8px; cursor: pointer; }
  .orow:hover { background: #f1f4f8; }
  .orow.on { background: var(--accent-soft); }
  .oname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ometa { font-size: 12px; color: var(--muted); }
  .oacts { position: absolute; top: 6px; right: 6px; display: flex; gap: 2px; }
  .oacts button { border: none; background: none; color: var(--muted); padding: 2px 5px; border-radius: 4px; font-size: 13px; }
  .oacts button:hover { background: #e3e8ef; color: var(--ink); }
  .orename { width: 100%; font: inherit; font-weight: 600; border: 1px solid var(--accent); border-radius: 4px; padding: 1px 4px; }
  .side-f { border-top: 1px solid var(--line); padding: 8px 12px; }
  .linkbtn { border: none; background: none; color: var(--accent); padding: 0; font-size: 13px; }
  .linkbtn.on { font-weight: 700; }
  .namerow { margin-bottom: 10px; }
  .namerow input { width: 100%; font: inherit; font-size: 17px; font-weight: 600; padding: 8px 12px;
                   border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .namerow input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  @media (max-width: 760px) {
    .shell { flex-direction: column; gap: 12px; align-items: stretch; }   /* full width, so wide tables scroll inside their box instead of widening the page */
    .side { width: 100%; position: static; max-height: none; }
    .side-h { flex-direction: row; align-items: center; justify-content: space-between; }
    .side-toggle { display: inline-block; }
    .side-title { display: none; }
    .side:not(.open) .olist, .side:not(.open) .side-f { display: none; }
  }

  .itembar { display: flex; justify-content: flex-end; gap: 8px; margin: -6px 0 10px; }
  .plain { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 7px 12px; font-size: 13px; }
  .plain:hover { background: #f1f4f8; }

  /* safe mode */
  .safe { display: flex; gap: 14px; align-items: center; justify-content: space-between; background: #fdecea; color: #8a1f12;
          border: 1px solid #f1b8ae; border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }
  .safe button { border: none; background: #c0392b; color: #fff; border-radius: 8px; padding: 7px 12px; font-weight: 600; white-space: nowrap; }

  /* prep instructions + backups */
  .prep { margin-top: 26px; }
  .prep-h, .bk-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .prep h3, .bk h2, .bk h3 { margin: 0; }
  .bk h3 { margin-top: 22px; }
  .prep textarea, .restore { width: 100%; font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.5;
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fbfcfe; resize: vertical; margin-top: 8px; }
  .restore { min-height: 90px; margin-bottom: 8px; }
  .bk td, .bk th { white-space: normal; }   /* wrap, so Restore stays on screen on a phone */
  .bk td:last-child { white-space: nowrap; width: 1%; }
  .add { border: none; background: var(--accent); color: #fff; border-radius: 8px; padding: 6px 12px; font-weight: 600; }

  @media print { .side, .tabs, .clear, .chips, .itembar, .namerow, header .sub { display: none; } .panel { border: none; } }
</style>
</head>
<body>
<div class="shell">
<aside class="side" id="side"></aside>
<div class="wrap">
  <div id="safeBanner"></div>
  <header>
    <div>
      <h1>MSS Packing Calculator</h1>
      <div class="sub">Bagging &amp; labeling costs — per unit, per pack, per case, per pallet, per order. <span id="ver">v1.7.1</span></div>
    </div>
    <button class="clear" onclick="clearOrder()">Clear order</button>
  </header>
  <div class="namerow" id="nameRow">
    <input id="orderName" type="text" autocomplete="off" oninput="onOrderNameInput(this.value)">
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>
</div>
</div>

<script>
'use strict';

// ---------- storage ----------
// Saved orders must survive every update. The rules: a failed read never leads
// to a write (safe mode locks saving), the raw data is snapshotted before every
// update, migrations only add or reshape, and no old storage key is deleted.
const APP_VERSION = 'v1.7.1';
const SCHEMA = 3;
const STORE_V1 = 'prepCostCalcV1';      // v1.0 to v1.5: a single order. Never deleted.
const STORE_V2 = 'prepCostCalcV2';      // v1.6 on: the book of saved orders
const BACKUP_KEY = 'prepCostCalc.backups';
const BACKUPS_KEPT = 10;

let safeMode = null;   // why the saved orders couldn't be read; while set, nothing is written

function newItem(id) {
  return {
    id,
    name: '',
    soldByCase: false,
    casePack: '',
    packSize: '',
    bagCost: '0.25',           // blank = no bag; follows the pack size and case pack (see ruleAnswers)
    labelCost: '0.25',
    setStickerCost: '0.15',    // blank = no "Sold as a Set" sticker; follows the pack size
    caseLabelCost: '0.25',
    casesPerPallet: '',
    casesOrdered: '',
    repackOK: 'yes',           // uneven cases: 'yes' = units may cross boxes
    boxStrategy: 'fill',       // 'fill' | 'spread' | 'strict'
    extraBoxes: false,         // the Additional boxes switch: off = no box charges at all
    reboxCount: '',            // extra boxes for odd repacks, e.g. a case that arrived open
    extraBoxCost: '',          // fills in at $1 when the switch comes on with nothing entered
    compareSizes: [],
  };
}

// Lowest "Tab N" not already used in this order.
function nextTabName(order) {
  const used = new Set(order.items.map(i => i.name));
  let n = 1;
  while (used.has('Tab ' + n)) n++;
  return 'Tab ' + n;
}

const nowIso = () => new Date().toISOString();

function freshOrder(id) {
  const at = nowIso();
  const o = { id, name: '', createdAt: at, updatedAt: at, items: [], active: null, nextId: 1 };
  const it = newItem(o.nextId++);
  it.name = nextTabName(o);
  o.items.push(it);
  o.active = it.id;
  return o;
}

function freshBook() {
  return { schema: SCHEMA, appVersion: APP_VERSION, orders: [freshOrder(1)], currentId: 1, nextOrderId: 2 };
}

function storeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function storeSet(key, value) { try { localStorage.setItem(key, value); return true; } catch (e) { return false; } }
const rawNow = () => ({ v1: storeGet(STORE_V1), v2: storeGet(STORE_V2) });

function readBackups() {
  try { const b = JSON.parse(storeGet(BACKUP_KEY) || '[]'); return Array.isArray(b) ? b : []; }
  catch (e) { return []; }
}

// Snapshot the raw stored text, not the parsed version, so a backup exists even
// when the data can't be read. Skipped when identical to the newest snapshot,
// so reloading a broken page can't push the good backups out of the list.
function takeBackup(reason, raw) {
  if (!raw.v1 && !raw.v2) return;
  const list = readBackups();
  const top = list[0];
  if (top && top.v1 === (raw.v1 || null) && top.v2 === (raw.v2 || null)) return;
  list.unshift({ at: nowIso(), version: APP_VERSION, reason, v1: raw.v1 || null, v2: raw.v2 || null });
  for (let keep = BACKUPS_KEPT; keep >= 1; keep = Math.floor(keep / 2)) {
    if (storeSet(BACKUP_KEY, JSON.stringify(list.slice(0, keep)))) return;   // shrink if the device is out of room
  }
}

// v1.0 to v1.5 stored one order with no wrapper around it.
function fromV1(old) {
  const at = nowIso();
  return { schema: 1, orders: [{ id: 1, name: 'Order 1', createdAt: at, updatedAt: at,
           items: old.items, active: old.active, nextId: old.nextId }], currentId: 1, nextOrderId: 2 };
}

// One numbered step per change to what's stored. Steps only add or reshape.
const MIGRATIONS = {
  // 1 -> 2 (v1.6): the set-sticker switch folds into the cost box (switched
  // off = blank cost), and automatic "Item N" names become "Tab N"
  1(book) {
    for (const o of book.orders) {
      for (const it of o.items) {
        if (it.needsSetSticker === false) it.setStickerCost = '';
        delete it.needsSetSticker;
      }
      for (const it of o.items) {
        const m = /^Item (\d+)$/.exec(it.name || '');
        if (!m) continue;
        const want = 'Tab ' + m[1];
        it.name = o.items.some(x => x !== it && x.name === want) ? '' : want;   // '' gets a free number in repair()
      }
    }
    book.schema = 2;
    return book;
  },
  // 2 -> 3 (v1.7): flat fee is gone, every item is itemized; and Additional
  // boxes gets its own switch. The switch starts on wherever boxes already
  // counted (an uneven case pack, or a box count or cost entered), so no total
  // moves. A flat item keeps its mode and rate in the data, unused, for the record.
  2(book) {
    for (const o of book.orders) {
      for (const it of o.items) {
        if (it.extraBoxes === undefined)
          it.extraBoxes = isUneven(it) || numInt(it.reboxCount) > 0 || num(it.extraBoxCost) > 0;
        if (it.mode !== 'flat') delete it.mode;
        if (!it.flatRate) delete it.flatRate;
      }
    }
    book.schema = 3;
    return book;
  },
};

function migrate(book) {
  while ((book.schema || 1) < SCHEMA) {
    const step = MIGRATIONS[book.schema || 1];
    if (!step) throw new Error('no upgrade path from saved format ' + book.schema);
    book = step(book);
  }
  return book;
}

const byRecent = (a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt));

// Check the shape and fill in anything newer versions added. Throws only when
// the data is unrecognisable; small inconsistencies are repaired, not refused.
function repair(book) {
  if (!book || typeof book !== 'object' || !Array.isArray(book.orders))
    throw new Error('saved orders are not in a format this version understands');
  if (!book.orders.length) book.orders.push(freshOrder(1));
  for (const o of book.orders) {
    if (!o || typeof o !== 'object' || !Array.isArray(o.items) || typeof o.id !== 'number')
      throw new Error('a saved order is damaged');
    if (typeof o.name !== 'string') o.name = '';
    if (!o.createdAt) o.createdAt = nowIso();
    if (!o.updatedAt) o.updatedAt = o.createdAt;
    o.items = o.items.map(it => {
      if (!it || typeof it !== 'object' || typeof it.id !== 'number') throw new Error('a saved item is damaged');
      return Object.assign(newItem(it.id), it);
    });
    if (!o.items.length) o.items.push(newItem(1));
    for (const it of o.items) if (!String(it.name || '').trim()) it.name = nextTabName(o);
    const maxItem = Math.max(...o.items.map(i => i.id));
    if (!(o.nextId > maxItem)) o.nextId = maxItem + 1;
    if (o.active !== 'total' && !o.items.some(i => i.id === o.active)) o.active = o.items[0].id;
  }
  const maxOrder = Math.max(...book.orders.map(o => o.id));
  if (!(book.nextOrderId > maxOrder)) book.nextOrderId = maxOrder + 1;
  if (!book.orders.some(o => o.id === book.currentId)) book.currentId = [...book.orders].sort(byRecent)[0].id;
  book.schema = SCHEMA;
  return book;
}

// Turn stored text (new format, or the old single order) into a checked book.
function bookFromText(v2text, v1text) {
  if (v2text) {
    const b = JSON.parse(v2text);
    if (!b || typeof b !== 'object') throw new Error('saved orders are not in a format this version understands');
    if ((b.schema || 0) > SCHEMA) throw new Error('these orders were saved by a newer version of the calculator');
    return repair(migrate(b));
  }
  if (v1text) {
    const old = JSON.parse(v1text);
    if (!old || !Array.isArray(old.items) || !old.items.length) return null;   // nothing was ever saved
    return repair(migrate(fromV1(old)));
  }
  return null;
}

function load() {
  const raw = rawNow();
  let book;
  try {
    const stored = raw.v2 ? JSON.parse(raw.v2) : null;
    const updating = raw.v2 ? (!stored || stored.appVersion !== APP_VERSION || (stored.schema || 0) < SCHEMA) : !!raw.v1;
    if (updating) takeBackup('before update to ' + APP_VERSION, raw);
    book = bookFromText(raw.v2, raw.v1);
  } catch (e) {
    // Never fall back to a blank order that would then be saved over the real
    // data. Lock saving, keep everything as it is, and say so.
    safeMode = (e && e.message) || String(e);
    takeBackup('could not be read', raw);
    return freshBook();
  }
  const last = readBackups()[0];
  if (!last || new Date(last.at).toDateString() !== new Date().toDateString()) takeBackup('daily', raw);
  if (!book) return freshBook();   // nothing saved yet, so nothing to write until the first edit
  book.appVersion = APP_VERSION;
  storeSet(STORE_V2, JSON.stringify(book));   // the old V1 key is left exactly as it was
  return book;
}

let book = load();
let state = currentOrder();   // the order on screen; every item function works on it
let view = 'order';           // 'order' | 'backups'

function currentOrder() { return book.orders.find(o => o.id === book.currentId) || book.orders[0]; }

function persist() {
  if (safeMode) return;
  book.appVersion = APP_VERSION;
  storeSet(STORE_V2, JSON.stringify(book));
}

// touch = this was an edit, so the order moves to the top of the list
function save(touch = true) {
  if (touch && state) state.updatedAt = nowIso();
  persist();
}

function num(v) {
  if (v === '' || v === null || v === undefined) return null;
  const n = parseFloat(v);
  return (isFinite(n) && n >= 0) ? n : null;
}

// Counts of physical things — units, packs, cases, boxes, pallets — are whole.
function numInt(v) {
  const n = num(v);
  return n === null ? null : Math.floor(n);
}

const INT_FIELDS = ['casePack', 'packSize', 'casesOrdered', 'casesPerPallet', 'reboxCount'];

// On leaving a box: counts snap to whole numbers and a 0 clears to an empty
// box (the grey placeholder shows instead). Updated in place, never with a
// re-render: rebuilding the page between mouse-down and click would swallow
// the click on whatever you were reaching for. The math already reads counts
// as whole numbers and blank as 0, so nothing on screen needs recalculating.
function tidyField(el, id, key) {
  if (ruleEdit && ruleEdit.key === key) ruleEdit = null;   // done typing in this box
  const it = state.items.find(i => i.id === id);
  if (!it) return;
  const before = it[key];
  const n = num(before);
  if (n === null) return;
  let after = INT_FIELDS.includes(key) ? String(Math.floor(n)) : before;
  if (Number(after) === 0) after = '';
  if (after === before) return;
  it[key] = after;
  el.value = after;
  save();
}

// ---------- math ----------
// A case pack that doesn't divide by the pack size is normal: leftover units
// carry over into the next case's packs, so packs are counted across the whole
// order, never rounded up case by case.
function isUneven(it) {
  const C = numInt(it.casePack), P = numInt(it.packSize);
  return !it.soldByCase && C > 0 && P > 0 && (C % P !== 0) && Math.floor(C / P) >= 1;
}

// ---------- automatic defaults ----------
// A few boxes follow the case pack and pack size:
//   pack size 1: no set sticker. Bigger packs: $0.15.
//   pack size = case pack: no bag (the case is already the pack). Otherwise $0.25.
//   uneven case pack: the Additional boxes switch comes on. Even: off.
// A rule only writes when its answer changes, so a number typed by hand stays
// put until a pack size or case pack change flips that same rule.
const DEFAULTS = { bagCost: '0.25', setStickerCost: '0.15', extraBoxCost: '1' };
const RULE_TRIGGERS = ['casePack', 'packSize'];

function ruleAnswers(it) {
  const C = numInt(it.casePack), P = numInt(it.packSize);
  const both = C > 0 && P > 0;
  return {
    setStickerCost: P > 0 ? (P === 1 ? '' : DEFAULTS.setStickerCost) : null,   // null = no answer yet
    bagCost: both ? (C === P ? '' : DEFAULTS.bagCost) : null,
    extraBoxes: both ? isUneven(it) : null,
  };
}

const ruleFields = it => ({ bagCost: it.bagCost, setStickerCost: it.setStickerCost,
                            extraBoxes: it.extraBoxes, extraBoxCost: it.extraBoxCost });

// Each rule whose answer differs from `before` takes its new answer; every
// other box goes back to `kept`, its value before the edit started. So a
// half-typed pack size ("1" on the way to "10") can't wipe a hand-typed cost.
function applyRules(it, before, kept) {
  const now = ruleAnswers(it);
  for (const k of ['bagCost', 'setStickerCost', 'extraBoxes'])
    it[k] = (now[k] !== null && now[k] !== before[k]) ? now[k] : kept[k];
  // the switch coming on with no cost entered starts at $1 a box
  it.extraBoxCost = (it.extraBoxes && !kept.extraBoxes && !(num(kept.extraBoxCost) > 0))
    ? DEFAULTS.extraBoxCost : kept.extraBoxCost;
}

// What this item would be at another pack size, with the defaults applied the
// same way typing that size would apply them. The compare table prices these.
function atPackSize(it, size) {
  const moved = Object.assign({}, it, { packSize: String(size) });
  applyRules(moved, ruleAnswers(it), ruleFields(it));
  return moved;
}

let ruleEdit = null;   // the case pack or pack size box being typed in, and what things were before

function setTrigger(el, id, key) {
  const it = state.items.find(i => i.id === id);
  if (!it) return;
  if (!ruleEdit || ruleEdit.it !== it || ruleEdit.key !== key)
    ruleEdit = { it, key, before: ruleAnswers(it), kept: ruleFields(it) };
  const was = ruleFields(it);
  it[key] = el.value;
  applyRules(it, ruleEdit.before, ruleEdit.kept);
  save();
  // update just the boxes that changed, so the box being typed in keeps focus
  for (const k of ['bagCost', 'setStickerCost']) {
    const box = document.querySelector(`#panel input[data-key="${k}"]`);
    if (box && it[k] !== was[k]) box.value = Number(it[k]) === 0 ? '' : it[k];
  }
  drawBoxRow(it);   // its note names the case pack and pack size
  renderResults(it);
}

function toggleBoxes(id) {
  const it = state.items.find(i => i.id === id);
  if (!it) return;
  it.extraBoxes = !it.extraBoxes;
  if (it.extraBoxes && !(num(it.extraBoxCost) > 0)) it.extraBoxCost = DEFAULTS.extraBoxCost;
  save();
  drawBoxRow(it);
  renderResults(it);
}

// Every line of arithmetic behind the number, so it can be checked by eye.
function showWork(o) {
  const W = [], P = [];
  const one = !o.N;                       // no order quantity yet → figures are for a single case
  const cases = o.N || 1;

  if (!o.soldByCase) {
    W.push({ l: 'Units', c: `${plural(cases, 'case')} × ${o.casePack} per case`, v: plural(o.totalUnits, 'unit') });
    W.push({
      l: 'Packs', c: `${o.totalUnits} units ÷ ${o.packSize} per pack`, v: plural(o.totalPacks, 'pack'),
      n: !o.uneven ? null : one
        ? `${o.casePack} doesn’t divide by ${o.packSize} — enter “cases in order” for the real count, since leftover units carry into the next case`
        : `${o.casePack} doesn’t divide by ${o.packSize}, so leftover units carry into the next case instead of making a partial pack in every case`
          + (o.looseUnits ? ` (the very last pack is ${o.looseUnits} of ${o.packSize})` : ''),
    });
    W.push({ l: o.setApplies ? 'Bag + ASIN + set sticker' : 'Bag + ASIN label',
             c: `${o.totalPacks} packs × (${fmt(o.bag)} + ${fmt(o.asin)}${o.setApplies ? ` + ${fmt(o.set)}` : ''})`,
             v: fmt(o.totalPacks * o.perPackRate) });
  }
  W.push({ l: 'Packing labels', c: `${plural(o.boxes, 'box')} × ${fmt(o.boxRate)}`, v: fmt(o.boxes * o.boxRate),
           n: o.boxNote || null });
  if (o.additional) {
    W.push({ l: 'Boxes for leftovers', c: `${o.additional} × ${fmt(o.extraRate)}`, v: fmt(o.additional * o.extraRate),
             n: o.extraRate ? null : o.boxesOn ? 'no cost per box entered yet' : 'Additional boxes is switched off' });
  }
  if (o.rebox) {
    W.push({ l: 'Additional boxes', c: `${plural(o.rebox, 'box')} × ${fmt(o.extraRate)}`, v: fmt(o.rebox * o.extraRate),
             n: o.extraRate ? null : 'no cost per box entered yet' });
  }

  const workTotal = { l: one ? 'Cost for one case' : 'Order prep total', v: fmt(o.cost) };

  if (!one) P.push({ l: 'Per case', c: `${fmt(o.cost)} ÷ ${plural(cases, 'case')}`, v: fmt(o.perCase) });
  if (!o.soldByCase) {
    P.push({ l: 'Per pack', c: `${fmt(o.cost)} ÷ ${plural(o.totalPacks, 'pack')}`, v: fmt(o.perPack) });
    P.push({ l: 'Per unit', c: `${fmt(o.cost)} ÷ ${plural(o.totalUnits, 'unit')}`, v: fmtUnit(o.perUnit),
             n: 'rounded up to the nearest penny' });
  }
  // stated as one chain so the arithmetic ties out exactly — a rounded per-case
  // figure multiplied by 90 would not match the pallet total shown
  if (o.pallets) P.push({ l: 'Per pallet', c: one
    ? `${fmt(o.perCase)} per case × ${o.pallets} cases per pallet`
    : `${fmt(o.cost)} ÷ ${plural(cases, 'case')} × ${o.pallets} per pallet`, v: fmt(o.perPallet) });

  return { work: W, workTotal, per: P };
}

function packRates(it) {
  // a blank cost box is $0: that step simply isn't done for this product
  const bag = num(it.bagCost) || 0, label = num(it.labelCost) || 0, caseLabel = num(it.caseLabelCost) || 0;
  const set = num(it.setStickerCost) || 0;
  // a "Sold as a Set" sticker is David's call per product (a manufacturer twin
  // pack can need one at pack size 1); leaving its cost blank means none
  const setApplies = set > 0;
  return { perPack: bag + label + (setApplies ? set : 0), boxCost: caseLabel,
           bag, asin: label, set, setApplies };
}

const boxes = (n) => `${n} box${n === 1 ? '' : 'es'}`;

function compute(it) {
  const packSize = numInt(it.packSize);
  const casePack = numInt(it.casePack);
  const pallets = numInt(it.casesPerPallet);
  const N = numInt(it.casesOrdered);
  const boxesOn = !!it.extraBoxes;   // the Additional boxes switch: off = no box charges at all
  const extraRate = boxesOn ? (num(it.extraBoxCost) || 0) : 0;
  const rebox = boxesOn ? (numInt(it.reboxCount) || 0) : 0;
  const reboxCost = rebox * extraRate;

  if (it.soldByCase) {
    const caseLabel = num(it.caseLabelCost) || 0;
    const boxCount = N || 1;
    const cost = caseLabel * boxCount + reboxCost;
    const perCase = cost / boxCount;
    const out = {
      perCase, perPack: null, perUnit: null,
      perPallet: (pallets > 0) ? perCase * pallets : null,
      packsLabel: null, warning: null, boxCount, rebox,
    };
    return Object.assign(out, showWork({
      soldByCase: true, N, boxes: boxCount, boxRate: caseLabel, additional: 0,
      rebox, extraRate, boxesOn, cost, perCase, perPallet: out.perPallet, pallets,
    }));
  }

  if (!casePack || casePack <= 0) return { error: 'Enter the case pack (units per case).' };
  if (!packSize || packSize <= 0) return { error: 'Enter the pack size (units per bag).' };
  const r = packRates(it);

  const packsMax = Math.ceil(casePack / packSize);
  const packsMin = Math.floor(casePack / packSize);
  const base = { casePack, packSize, pallets, N, boxesOn,
                 perPackRate: r.perPack, bag: r.bag, asin: r.asin,
                 set: r.set, setApplies: r.setApplies, boxRate: r.boxCost };

  // even split — every case is identical
  if (!isUneven(it)) {
    const packsPerCase = packsMax;
    const boxCount = N || 1;
    const totalUnits = casePack * boxCount;
    const totalPacks = packsPerCase * boxCount;
    const cost = totalPacks * r.perPack + boxCount * r.boxCost + reboxCost;
    const perCase = cost / boxCount;
    const out = {
      perCase, perPack: cost / totalPacks, perUnit: cost / totalUnits,
      perPallet: (pallets > 0) ? perCase * pallets : null,
      packsLabel: String(packsPerCase), warning: null,
      totalUnits, totalPacks, boxCount, rebox, packsPerCase,
    };
    return Object.assign(out, showWork(Object.assign({}, base, {
      totalUnits, totalPacks, boxes: boxCount, additional: 0, rebox, extraRate, cost,
      perCase, perPack: out.perPack, perUnit: out.perUnit, perPallet: out.perPallet,
    })));
  }

  // uneven — the order quantity decides how the leftovers land
  if (!N || N <= 0) {
    const perCase = packsMax * r.perPack + r.boxCost + reboxCost;
    const out = {
      perCase, perPack: perCase / packsMax, perUnit: perCase / casePack,
      perPallet: (pallets > 0) ? perCase * pallets : null,
      packsLabel: `${packsMin}–${packsMax}`, uneven: true, needsQty: true,
      warning: `${casePack} doesn’t divide into packs of ${packSize}. Enter “cases in order” — leftover units carry into the next case, so the real pack count depends on the whole order.`,
    };
    return Object.assign(out, showWork(Object.assign({}, base, {
      uneven: true, totalUnits: casePack, totalPacks: packsMax, boxes: 1, additional: 0,
      rebox, extraRate, cost: perCase, perCase, perPack: out.perPack, perUnit: out.perUnit, perPallet: out.perPallet,
    })));
  }

  const totalUnits = casePack * N;
  const fullPacks = Math.floor(totalUnits / packSize);
  const looseUnits = totalUnits - fullPacks * packSize;
  const totalPacks = fullPacks + (looseUnits ? 1 : 0);

  const variants = [];
  if (it.repackOK === 'no') {
    // boxes are not re-mixed: each keeps only whole packs from its own case,
    // and the pooled leftovers need boxes of their own
    const leftoverPacks = Math.max(0, totalPacks - N * packsMin);
    const additional = Math.ceil(leftoverPacks / packsMax);
    variants.push({
      key: 'strict', name: 'Leftovers boxed separately',
      boxes: N + additional, additional, unused: 0,
      detail: `${boxes(N)} of ${packsMin * packSize}`
        + (additional ? ` + ${additional} additional box${additional === 1 ? '' : 'es'} for the ${leftoverPacks} leftover pack${leftoverPacks === 1 ? '' : 's'}` : ''),
      note: additional ? `${additional} more box${additional === 1 ? '' : 'es'} than you received` : null,
    });
  } else {
    const fillBoxes = Math.ceil(totalPacks / packsMax);
    const lastPacks = totalPacks - (fillBoxes - 1) * packsMax;
    const fullBoxes = lastPacks === packsMax ? fillBoxes : fillBoxes - 1;
    const spare = Math.max(0, N - fillBoxes);
    variants.push({
      key: 'fill', name: `Fill to ${packsMax * packSize}`,
      boxes: fillBoxes, additional: Math.max(0, fillBoxes - N), unused: spare,
      detail: (fullBoxes ? `${boxes(fullBoxes)} of ${packsMax * packSize}` : '')
        + (fullBoxes && fullBoxes < fillBoxes ? ' + ' : '')
        + (fullBoxes < fillBoxes ? `1 box of ${lastPacks * packSize}` : ''),
      note: spare ? `${boxes(spare)} you received left empty` : null,
    });
    if (packsMin >= 1 && totalPacks >= N * packsMin && totalPacks <= N * packsMax) {
      const big = totalPacks - N * packsMin;
      const small = N - big;
      const parts = [];
      if (big) parts.push(`${boxes(big)} of ${packsMax * packSize}`);
      if (small) parts.push(`${big ? small : boxes(small)} of ${packsMin * packSize}`);
      variants.push({
        key: 'spread', name: `Use all ${N} boxes`,
        boxes: N, additional: 0, unused: 0,
        detail: parts.join(' + '), note: null,
      });
    }
  }

  variants.forEach(v => {
    v.cost = totalPacks * r.perPack + v.boxes * r.boxCost + v.additional * extraRate + reboxCost;
    v.perCase = v.cost / N;
    v.perUnit = v.cost / totalUnits;
  });

  const chosen = variants.find(v => v.key === it.boxStrategy) || variants[0];
  const out = {
    perCase: chosen.perCase,
    perPack: chosen.cost / totalPacks,
    perUnit: chosen.perUnit,
    perPallet: (pallets > 0) ? chosen.perCase * pallets : null,
    packsLabel: `${packsMin}–${packsMax}`,
    uneven: true, totalUnits, totalPacks, looseUnits, packsMin, packsMax,
    variants, chosen, warning: null, boxCount: chosen.boxes, rebox,
  };
  return Object.assign(out, showWork(Object.assign({}, base, {
    uneven: true, totalUnits, totalPacks, looseUnits,
    boxes: chosen.boxes, additional: chosen.additional, rebox, extraRate,
    boxNote: chosen.note, cost: chosen.cost,
    perCase: out.perCase, perPack: out.perPack, perUnit: out.perUnit, perPallet: out.perPallet,
  })));
}

// ordered quantity: total cases, with pallet breakdown derived from cases/pallet
function orderedQty(it) {
  const cases = numInt(it.casesOrdered);
  if (!cases || cases <= 0) return { cases: null };
  const perPallet = numInt(it.casesPerPallet);
  let label = cases + ' case' + (cases === 1 ? '' : 's');
  if (perPallet && perPallet > 0 && cases >= perPallet) {
    const plt = Math.floor(cases / perPallet);
    const loose = cases - plt * perPallet;
    label += ` = ${plt} pallet${plt === 1 ? '' : 's'}${loose ? ` + ${loose} loose` : ''}`;
  }
  return { cases, label };
}

// ---------- money formatting ----------
function fmt(n) {
  if (n === null || n === undefined || !isFinite(n)) return '—';
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtUnit(n) { // per-unit is rounded UP to the nearest penny
  if (n === null || n === undefined || !isFinite(n)) return '—';
  return fmt(Math.ceil(n * 100 - 1e-9) / 100);
}

// ---------- state helpers ----------
function activeItem() { return state.items.find(i => i.id === state.active) || null; }
function set(itemId, key, value) {
  const it = state.items.find(i => i.id === itemId);
  if (!it) return;
  it[key] = value;
  save();
}

function addItem() {
  const it = newItem(state.nextId++);
  it.name = nextTabName(state);
  state.items.push(it);
  state.active = it.id;
  save(); render();
}

function deleteItem(id) {
  const it = state.items.find(i => i.id === id);
  if (!it) return;
  if (!confirm(`Delete “${it.name}”?`)) return;
  state.items = state.items.filter(i => i.id !== id);
  if (!state.items.length) {
    const fresh = newItem(state.nextId++);
    fresh.name = nextTabName(state);
    state.items = [fresh];
  }
  if (state.active === id) state.active = state.items[0].id;
  save(); render();
}

function resetItem(id) {
  const it = state.items.find(i => i.id === id);
  if (!it) return;
  if (!confirm(`Reset all numbers on “${it.name}”?`)) return;
  const fresh = newItem(it.id);
  fresh.name = it.name;
  state.items[state.items.indexOf(it)] = fresh;
  save(); render();
}

// Copy a tab into a new one right after it. A JSON round trip so the copy
// shares nothing (its compare list etc.) with the original.
function duplicateItem(id) {
  const it = state.items.find(i => i.id === id);
  if (!it) return;
  const copy = JSON.parse(JSON.stringify(it));
  copy.id = state.nextId++;
  const used = new Set(state.items.map(i => i.name));
  const base = it.name.replace(/ \(copy( \d+)?\)$/, '');   // a copy of a copy is "(copy 2)", not "(copy) (copy)"
  let name = `${base} (copy)`;
  for (let n = 2; used.has(name); n++) name = `${base} (copy ${n})`;
  copy.name = name;
  state.items.splice(state.items.indexOf(it) + 1, 0, copy);
  state.active = copy.id;
  save(); render();
}

// Empties the order on screen but keeps its name and its place in the list.
function clearOrder() {
  if (!confirm(`Clear every item from “${orderName(state)}” and start it fresh?`)) return;
  state.items = [];
  const it = newItem(state.nextId++);
  it.name = nextTabName(state);
  state.items.push(it);
  state.active = it.id;
  save(); render();
}

function switchTab(id) { state.active = id; save(false); render(); }

// ---------- saved orders ----------
const fmtWhen = iso => new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const orderName = o => o.name.trim() || fmtWhen(o.createdAt);

// Untouched: no name and a single tab still holding the defaults.
function isPristine(o) {
  if (o.name.trim() || o.items.length !== 1) return false;
  const strip = it => { const c = Object.assign({}, it); delete c.id; delete c.name; delete c.showWork; return JSON.stringify(c); };
  return strip(o.items[0]) === strip(newItem(0));
}

function openOrder(id) {
  const leaving = state;
  book.currentId = id;
  state = currentOrder();
  view = 'order';
  // an untouched blank order isn't worth keeping in the list once you leave it
  if (leaving !== state && isPristine(leaving) && book.orders.length > 1)
    book.orders = book.orders.filter(o => o !== leaving);
  persist(); render();
}

function newOrder() {
  const blank = book.orders.find(isPristine);   // reuse a blank one rather than stack them up
  if (blank) { openOrder(blank.id); }
  else {
    const o = freshOrder(book.nextOrderId++);
    book.orders.push(o);
    book.currentId = o.id;
    state = o;
    view = 'order';
    persist(); render();
  }
  sideOpen = false;
  renderSidebar();
  const box = document.getElementById('orderName');
  if (box) box.focus();
}

function deleteOrder(id) {
  const o = book.orders.find(x => x.id === id);
  if (!o) return;
  if (!confirm(`Delete the order “${orderName(o)}”? A copy is kept under Backups.`)) return;
  takeBackup(`before deleting “${orderName(o)}”`, rawNow());
  book.orders = book.orders.filter(x => x !== o);
  if (!book.orders.length) book.orders.push(freshOrder(book.nextOrderId++));
  if (book.currentId === id) book.currentId = [...book.orders].sort(byRecent)[0].id;
  state = currentOrder();
  view = 'order';
  persist(); render();
}

function renameOrder(id, name) {
  const o = book.orders.find(x => x.id === id);
  if (!o || o.name === name.trim()) return;
  o.name = name.trim();
  o.updatedAt = nowIso();
  persist();
  const box = document.getElementById('orderName');
  if (box && o === state) box.value = o.name;   // a sidebar rename is never typed in the box itself
}

function startOrderRename(id) {
  const o = book.orders.find(x => x.id === id);
  const row = document.querySelector(`.orow[data-id="${id}"]`);
  if (!o || !row) return;
  const nameEl = row.querySelector('.oname');
  const input = document.createElement('input');
  input.className = 'orename';
  input.value = o.name;
  input.placeholder = fmtWhen(o.createdAt);
  nameEl.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const finish = keep => {
    if (done) return;
    done = true;
    if (keep) renameOrder(id, input.value);
    input.remove();
    renderSidebar();
  };
  input.onkeydown = e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); };
  input.onblur = () => finish(true);
  input.onclick = e => e.stopPropagation();
}

let sideOpen = false;   // phone / narrow window: the order list folds away behind a button
function toggleSide() { sideOpen = !sideOpen; renderSidebar(); }

// ---------- backups ----------
function openBackups() { view = 'backups'; sideOpen = false; render(); }
function closeBackups() { view = 'order'; render(); }

// In safe mode the copy is the raw stored text, so nothing unreadable is lost.
const backupText = () => safeMode ? (storeGet(STORE_V2) || storeGet(STORE_V1) || '') : JSON.stringify(book);

function reloadPage() { location.reload(); }   // its own function so a test can hold it back

function applyRestore(b) {
  takeBackup('before restore', rawNow());
  b.appVersion = APP_VERSION;
  if (!storeSet(STORE_V2, JSON.stringify(b))) { alert('Couldn’t save the restored orders on this device.'); return; }
  reloadPage();
}

function restoreBackup(i) {
  const entry = readBackups()[i];
  if (!entry) return;
  let b;
  try { b = bookFromText(entry.v2, entry.v1); if (!b) throw new Error('it is empty'); }
  catch (e) { alert('This backup can’t be read: ' + e.message); return; }
  if (!confirm(`Restore the backup from ${fmtWhen(entry.at)}? Your current orders are backed up first, so this can be undone.`)) return;
  applyRestore(b);
}

function restoreFromText() {
  const text = document.getElementById('restoreText').value.trim();
  if (!text) return;
  let b;
  try {
    const parsed = JSON.parse(text);
    b = Array.isArray(parsed && parsed.orders) ? bookFromText(text, null) : bookFromText(null, text);
    if (!b) throw new Error('it is empty');
  } catch (e) { alert('That text isn’t a calculator backup: ' + e.message); return; }
  const n = b.orders.length;
  if (!confirm(`Replace the orders on this device with the ${n} order${n === 1 ? '' : 's'} in the pasted backup? Your current orders are backed up first.`)) return;
  applyRestore(b);
}

// Only offered in safe mode: the unreadable data is already in Backups.
function startFresh() {
  if (!confirm('Start a blank order list? The unreadable data stays in Backups.')) return;
  takeBackup('could not be read', rawNow());
  storeSet(STORE_V2, JSON.stringify(freshBook()));
  reloadPage();
}

// Old-style copy first: it works inside the Mac app's web view, where the
// newer clipboard call can be refused without any error.
function copyText(text, btn) {
  const label = btn.textContent;
  const flash = msg => { btn.textContent = msg; setTimeout(() => { btn.textContent = label; }, 2000); };
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  if (ok) return flash('Copied');
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(() => flash('Copied'), () => flash('Select the text and press ⌘C'));
  else flash('Select the text and press ⌘C');
}

// ---------- rendering ----------
const $tabs = document.getElementById('tabs');
const $panel = document.getElementById('panel');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function render() {
  renderSafeBanner();
  renderSidebar();
  const nameRow = document.getElementById('nameRow');
  if (view === 'backups') {
    nameRow.style.display = 'none';
    $tabs.innerHTML = '';
    renderBackups();
    return;
  }
  nameRow.style.display = '';
  const box = document.getElementById('orderName');
  // leave it alone only while you're typing in it for this same order
  if (document.activeElement !== box || box.dataset.oid !== String(state.id)) {
    box.value = state.name;
    box.dataset.oid = state.id;
  }
  box.placeholder = `Order name, e.g. store or SO number (unnamed: ${fmtWhen(state.createdAt)})`;
  renderTabs();
  if (state.active === 'total') renderTotal();
  else renderItemPanel(activeItem());
}

function onOrderNameInput(v) { state.name = v; save(); renderSidebar(); }

function renderSafeBanner() {
  const el = document.getElementById('safeBanner');
  el.innerHTML = !safeMode ? '' : `<div class="safe">
    <div><strong>Couldn’t read your saved orders.</strong> Nothing has been changed, and nothing will be
    saved until this is fixed. <span class="muted">(${esc(safeMode)})</span></div>
    <button onclick="openBackups()">Open Backups</button></div>`;
}

function renderSidebar() {
  const side = document.getElementById('side');
  if (!side || side.querySelector('input.orename')) return;   // don't rebuild under an open rename
  const orders = [...book.orders].sort(byRecent);
  side.className = 'side' + (sideOpen ? ' open' : '');
  side.innerHTML = `
    <div class="side-h">
      <button class="side-toggle" onclick="toggleSide()">${sideOpen ? '▾' : '▸'} Orders (${orders.length})</button>
      <div class="side-title">Orders</div>
      <button class="newbtn" onclick="newOrder()">+ New order</button>
    </div>
    <div class="olist">${orders.map(o => {
      const t = orderTotal(o);
      const n = o.items.length;
      return `<div class="orow${o.id === book.currentId && view === 'order' ? ' on' : ''}" data-id="${o.id}" onclick="openOrder(${o.id})">
        <div class="oname">${esc(orderName(o))}</div>
        <div class="ometa">${n} item${n === 1 ? '' : 's'} · ${t.complete ? fmt(t.grand) : 'no total yet'}</div>
        <div class="ometa">Edited ${esc(fmtWhen(o.updatedAt))}</div>
        <div class="oacts">
          <button title="Rename" onclick="event.stopPropagation();startOrderRename(${o.id})">✎</button>
          <button title="Delete" onclick="event.stopPropagation();deleteOrder(${o.id})">✕</button>
        </div>
      </div>`;
    }).join('')}</div>
    <div class="side-f"><button class="linkbtn${view === 'backups' ? ' on' : ''}" onclick="openBackups()">Backups</button></div>`;
}

function renderBackups() {
  const list = readBackups();
  const ordersIn = e => {
    try { const b = bookFromText(e.v2, e.v1); return b ? `${b.orders.length} order${b.orders.length === 1 ? '' : 's'}` : 'empty'; }
    catch (err) { return 'unreadable'; }
  };
  $panel.innerHTML = `
    <div class="bk">
      <div class="bk-top"><h2>Backups</h2><button class="clear" onclick="closeBackups()">← Back to the order</button></div>
      <p class="hint">Taken automatically before every update, before an order is deleted, before a restore, and once a day.
      The newest ${BACKUPS_KEPT} are kept, on this device only.</p>
      ${list.length ? `<div class="tablewrap"><table>
        <thead><tr><th>When</th><th>Why</th><th>Holds</th><th></th></tr></thead>
        <tbody>${list.map((e, i) => `<tr>
          <td>${esc(fmtWhen(e.at))}</td><td>${esc(e.reason)}</td><td>${esc(ordersIn(e))}</td>
          <td><button class="add" onclick="restoreBackup(${i})">Restore</button></td></tr>`).join('')}</tbody>
      </table></div>` : '<p class="incomplete">No backups yet. One is taken the first time anything is saved each day.</p>'}
      <h3>Move orders to another device</h3>
      <p class="hint">Copy here, then paste into the box on the other device and restore.</p>
      <button class="add" onclick="copyText(backupText(), this)">Copy backup</button>
      <textarea id="restoreText" class="restore" placeholder="Paste a copied backup here"></textarea>
      <button class="add" onclick="restoreFromText()">Restore from pasted text</button>
      ${safeMode ? `<h3>Start over</h3>
      <p class="hint">If no backup works, start a blank list. The unreadable data stays in this list.</p>
      <button class="clear" onclick="startFresh()">Start a blank order list</button>` : ''}
    </div>`;
}

function renderTabs() {
  $tabs.innerHTML = '';
  const list = document.createElement('div');
  list.className = 'tablist';
  for (const it of state.items) {
    const tab = document.createElement('div');
    tab.className = 'tab' + (state.active === it.id ? ' active' : '');
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = it.name;
    name.title = state.active === it.id ? 'Click to rename' : it.name;
    tab.appendChild(name);
    const x = document.createElement('button');
    x.className = 'close'; x.textContent = '✕'; x.title = 'Delete item';
    x.onclick = (e) => { e.stopPropagation(); deleteItem(it.id); };
    tab.appendChild(x);
    tab.onclick = () => {
      if (state.active !== it.id) { switchTab(it.id); return; }
      startRename(tab, name, it);
    };
    list.appendChild(tab);
  }
  const add = document.createElement('button');
  add.className = 'addtab'; add.textContent = '+ Add item';
  add.onclick = addItem;
  list.appendChild(add);
  $tabs.appendChild(list);

  const total = document.createElement('div');
  total.className = 'tab total-tab' + (state.active === 'total' ? ' active' : '');
  total.innerHTML = '<span class="name">Σ Order Total</span>';
  total.onclick = () => switchTab('total');
  $tabs.appendChild(total);
}

function startRename(tab, nameEl, it) {
  if (tab.querySelector('input.rename')) return;
  const input = document.createElement('input');
  input.className = 'rename';
  input.value = it.name;
  nameEl.replaceWith(input);
  input.focus(); input.select();
  const commit = () => {
    const typed = input.value.trim();
    if (typed) it.name = typed;
    else { it.name = ''; it.name = nextTabName(state); }
    save(); render();
  };
  input.onblur = commit;
  input.onkeydown = (e) => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = it.name; input.blur(); } };
  input.onclick = (e) => e.stopPropagation();
}

function field(label, inputHtml, hint) {
  return `<div class="field"><label>${label}</label>${inputHtml}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
}

function renderItemPanel(it) {
  if (!it) { $panel.innerHTML = ''; return; }
  const soldSeg = `
    <div class="field"><label>Resold by Case?</label>
      <div class="seg">
        <button class="${it.soldByCase ? 'on' : ''}" onclick="set(${it.id},'soldByCase',true);render()">Yes</button>
        <button class="${!it.soldByCase ? 'on' : ''}" onclick="set(${it.id},'soldByCase',false);render()">No</button>
      </div>
      <div class="hint">${it.soldByCase ? 'Prep = just the packing label.' : 'Item gets bagged &amp; labeled.'}</div>
    </div>`;

  let inputs = `<div class="row">${soldSeg}</div>
  <div class="row nowrap">
    ${field('Cases in order', numInput(it, 'casesOrdered', '0', '1'), '')}
    ${it.soldByCase ? '' : field('Case pack <span class="muted" style="font-weight:400">(units per case)</span>', numInput(it, 'casePack', '0', '1'), '')}
    ${field('Cases per pallet <span class="muted" style="font-weight:400">(optional)</span>', numInput(it, 'casesPerPallet', '0', '1'), '')}
    ${it.soldByCase ? '' : field('Pack size <span class="muted" style="font-weight:400">(units per bag)</span>', numInput(it, 'packSize', '0', '1', `onkeydown="if(event.key==='Enter')addPackToCompare(${it.id},this.value)"`), '1 = bag every unit individually')}
  </div>`;

  if (!it.soldByCase) {
    inputs += `<div class="row nowrap">
      ${field('Bag Cost <span class="muted" style="font-weight:400">($/pack)</span>', numInput(it, 'bagCost', '0.00', '0.01'))}
      ${field('ASIN Label Cost <span class="muted" style="font-weight:400">($/pack)</span>', numInput(it, 'labelCost', '0.00', '0.01'))}
      ${field('Set Sticker Cost <span class="muted" style="font-weight:400">($/pack)</span>', numInput(it, 'setStickerCost', '0.00', '0.01'))}
      ${field('Packing Label Cost <span class="muted" style="font-weight:400">($/case)</span>', numInput(it, 'caseLabelCost', '0.00', '0.01'))}
    </div>`;
  } else {
    inputs += `<div class="row">
      ${field('Packing Label Cost <span class="muted" style="font-weight:400">($/case)</span>', numInput(it, 'caseLabelCost', '0.00', '0.01'))}
    </div>`;
  }

  inputs += `<div class="row nowrap" id="boxRow">${boxRowHtml(it)}</div>`;

  const resetBtn = `<div class="itembar">
    <button class="plain" onclick="duplicateItem(${it.id})" title="Copy this tab into a new tab">⧉ Duplicate item</button>
    <button class="clear" onclick="resetItem(${it.id})" title="Reset this item’s numbers to defaults">↺ Reset item</button>
  </div>`;
  ruleEdit = null;   // a full redraw means no box is mid-edit
  $panel.innerHTML = resetBtn + inputs + '<div id="unevenBox"></div><hr class="divider"><div id="results"></div>' +
    (!it.soldByCase ? compareHtml(it) : '');
  renderResults(it);
}

// The Additional boxes switch, and its two boxes while it's on.
function boxRowHtml(it) {
  const on = !!it.extraBoxes, uneven = isUneven(it);
  const why = uneven ? `${numInt(it.casePack)} doesn’t divide into packs of ${numInt(it.packSize)}` : '';
  return `
    <div class="field"><label>Additional boxes</label>
      <button class="sw${on ? ' on' : ''}" role="switch" aria-checked="${on}" aria-label="Additional boxes"
        onclick="toggleBoxes(${it.id})"><span></span></button>
      <div class="hint">${on ? (why ? 'On: ' + why : 'On') : 'Off'}</div>
    </div>
    ${on ? field('Boxes to add', numInput(it, 'reboxCount', '0', '1'),
        uneven ? 'on top of the boxing worked out below' : 'e.g. a case that arrives open and has to be reboxed') : ''}
    ${on ? field('Cost per Box <span class="muted" style="font-weight:400">($/box)</span>', numInput(it, 'extraBoxCost', '0.00', '0.01')) : ''}`;
}

function drawBoxRow(it) {
  const row = document.getElementById('boxRow');
  if (row) row.innerHTML = boxRowHtml(it);
}

function numInput(it, key, placeholder, step, extra) {
  const v = it[key];
  const shown = (v === '' || v == null || Number(v) === 0) ? '' : v;   // a 0 shows as the grey placeholder
  const onInput = RULE_TRIGGERS.includes(key)
    ? `setTrigger(this,${it.id},'${key}')`
    : `set(${it.id},'${key}',this.value);renderResults(activeItem())`;
  return `<input type="number" min="0" step="${step || 'any'}" value="${esc(shown)}" placeholder="${esc(placeholder || '')}"
    data-key="${key}" oninput="${onInput}" onblur="tidyField(this,${it.id},'${key}')" ${extra || ''}>`;
}

// Enter in the pack-size box drops that size straight into the compare section
function addPackToCompare(id, v) {
  const it = state.items.find(i => i.id === id);
  const n = parseFloat(v);
  if (!it || !isFinite(n) || n <= 0) return;
  if (!it.compareSizes.includes(n)) {
    it.compareSizes.push(n);
    it.compareSizes.sort((a, b) => a - b);
    save();
  }
  const d = document.querySelector('details.compare');
  if (d) d.open = true;
  renderResults(activeItem());
}

// The uneven-cases question. Rebuilt only when its shape actually changes, so
// typing in the Additional Boxes field doesn't blow away its own focus.
function renderUneven(it) {
  const el = document.getElementById('unevenBox');
  if (!el) return;
  const on = isUneven(it);
  const sig = on ? `${numInt(it.casePack)}|${numInt(it.packSize)}|${it.repackOK}` : 'off';
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  if (!on) { el.innerHTML = ''; return; }

  const C = numInt(it.casePack), P = numInt(it.packSize);
  const lo = Math.floor(C / P) * P, hi = Math.ceil(C / P) * P;
  el.innerHTML = `
    <div class="ask">
      <div class="ask-q">⚠️ Uneven cases — will it repack correct?</div>
      <div class="ask-why">${C} units don’t divide into packs of ${P}, so a box ends up holding ${lo} or ${hi} units, not ${C}.</div>
      <div class="ask-row">
        <div class="seg">
          <button class="${it.repackOK === 'yes' ? 'on' : ''}" onclick="setRepack(${it.id},'yes')">Yes</button>
          <button class="${it.repackOK === 'no' ? 'on' : ''}" onclick="setRepack(${it.id},'no')">No</button>
        </div>
        <div class="ask-note">${it.repackOK === 'yes'
          ? `Units carry over between boxes — boxes hold ${lo} or ${hi}.`
          : `Each box keeps only whole packs from its own case; leftovers get their own boxes.`}</div>

      </div>
    </div>`;
}

function setRepack(id, v) {
  set(id, 'repackOK', v);
  set(id, 'boxStrategy', v === 'no' ? 'strict' : 'fill');
  renderResults(activeItem());
}

function pickStrategy(id, key) {
  set(id, 'boxStrategy', key);
  renderResults(activeItem());
}

function renderResults(it) {
  const el = document.getElementById('results');
  if (!el || !it) return;
  renderUneven(it);
  const r = compute(it);
  if (r.error) {
    el.innerHTML = `<div class="incomplete">${esc(r.error)}</div>`;
    refreshCompareTable(it);
    renderSidebar();
    return;
  }
  const qty = orderedQty(it);
  const orderTotal = qty.cases ? r.perCase * qty.cases : null;
  el.innerHTML = `
    ${r.warning ? `<div class="warning" style="margin-bottom:10px">⚠️ ${esc(r.warning)}</div>` : ''}
    ${r.uneven && r.totalPacks ? `<div class="hint" style="margin-bottom:10px">${r.totalUnits} units across ${qty.cases} cases = <strong>${r.totalPacks} packs</strong>${r.looseUnits ? ` (last pack short by ${num(it.packSize) - r.looseUnits})` : ''} — leftovers carry between cases, so no partial pack per case.</div>` : ''}
    <div class="results">
      <div class="stat primary"><div class="k">Per case</div><div class="v">${fmt(r.perCase)}</div>
        ${r.packsLabel ? `<div class="note">${r.packsLabel} pack${r.packsLabel === '1' ? '' : 's'} per case</div>` : ''}</div>
      ${it.soldByCase ? '' : `<div class="stat"><div class="k">Per pack</div><div class="v">${fmt(r.perPack)}</div></div>
      <div class="stat"><div class="k">Per unit</div><div class="v">${fmtUnit(r.perUnit)}</div></div>`}
      ${r.perPallet !== null ? `<div class="stat"><div class="k">Per pallet</div><div class="v">${fmt(r.perPallet)}</div>
        <div class="note">${num(it.casesPerPallet)} cases</div></div>` : ''}
      ${orderTotal !== null ? `<div class="stat"><div class="k">This order</div><div class="v">${fmt(orderTotal)}</div><div class="note">${esc(qty.label)}</div></div>` : ''}
    </div>
    ${variantsHtml(it, r)}
    ${workHtml(it, r)}`;
  refreshCompareTable(it);
  renderSidebar();
}

// The full arithmetic, line by line.
function workHtml(it, r) {
  if (!r.work) return '';
  const line = (x) => `<tr><td class="wl">${esc(x.l)}</td><td class="wc">${esc(x.c)}</td><td class="wv">${esc(x.v)}</td></tr>`
    + (x.n ? `<tr class="wn"><td></td><td colspan="2">${esc(x.n)}</td></tr>` : '');
  return `<details class="work"${it.showWork === false ? '' : ' open'}
      ontoggle="set(${it.id},'showWork',this.open)">
    <summary>Show the math — ${esc(it.name)}</summary>
    <div class="tablewrap">
      <table class="worktbl">
        <tbody>
          ${r.work.map(line).join('')}
          <tr class="wtot"><td class="wl">${esc(r.workTotal.l)}</td><td></td><td class="wv">${esc(r.workTotal.v)}</td></tr>
        </tbody>
      </table>
      ${r.per.length ? `<div class="worksub">Divided out</div>
      <table class="worktbl"><tbody>${r.per.map(line).join('')}</tbody></table>` : ''}
    </div>
  </details>`;
}

// How the boxes actually get filled when the case pack is uneven.
function variantsHtml(it, r) {
  if (!r.variants || !r.variants.length) return '';
  const many = r.variants.length > 1;
  return `<div class="boxes">
    <div class="boxes-h">${many ? 'How do you want to box it?' : 'Boxing'}</div>
    ${r.variants.map(v => `
      <div class="boxopt${v === r.chosen ? ' on' : ''}"${many ? ` onclick="pickStrategy(${it.id},'${v.key}')"` : ''}>
        <div class="boxopt-l">
          ${many ? `<span class="radio">${v === r.chosen ? '●' : '○'}</span>` : ''}
          <div>
            <div class="boxopt-n">${esc(v.name)} — <strong>${v.boxes} box${v.boxes === 1 ? '' : 'es'}</strong>${v.additional ? ` <span class="extra">+${v.additional} additional</span>` : ''}</div>
            <div class="boxopt-d">${esc(v.detail)}</div>
          </div>
        </div>
        <div class="boxopt-c">${fmt(v.cost)}<div class="boxopt-pc">${fmt(v.perCase)}/case</div></div>
      </div>`).join('')}
    ${!r.chosen.additional ? '' : !it.extraBoxes
      ? `<div class="hint" style="margin-top:6px">Additional boxes is switched off, so the ${r.chosen.additional} extra box${r.chosen.additional === 1 ? '' : 'es'} cost nothing. Turn it on above to charge for them.</div>`
      : !num(it.extraBoxCost)
      ? `<div class="hint" style="margin-top:6px">Enter a <strong>Cost per Box</strong> above to include the ${r.chosen.additional} extra box${r.chosen.additional === 1 ? '' : 'es'} in the total.</div>` : ''}
  </div>`;
}

// ---------- comparison ----------
function compareHtml(it) {
  return `
  <details class="compare" open>
    <summary>Compare pack sizes (for quoting customers)</summary>
    <div class="chips" id="chips"></div>
    <div class="tablewrap" id="comparetable"></div>
  </details>`;
}

function refreshCompareTable(it) {
  const chips = document.getElementById('chips');
  const tbl = document.getElementById('comparetable');
  if (!chips || !tbl || it.soldByCase) return;

  chips.innerHTML = '';
  for (const s of it.compareSizes) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `pack of ${s} `;
    const x = document.createElement('button');
    x.textContent = '✕'; x.title = 'Remove';
    x.onclick = () => { it.compareSizes = it.compareSizes.filter(v => v !== s); save(); renderResults(it); };
    chip.appendChild(x);
    chips.appendChild(chip);
  }
  const input = document.createElement('input');
  input.type = 'number'; input.min = '1'; input.placeholder = 'size';
  const add = document.createElement('button');
  add.className = 'add'; add.textContent = '+ Add';
  const doAdd = () => {
    const v = parseFloat(input.value);
    if (isFinite(v) && v > 0 && !it.compareSizes.includes(v)) {
      it.compareSizes.push(v);
      it.compareSizes.sort((a, b) => a - b);
      save(); renderResults(it);
    }
    input.value = '';
  };
  add.onclick = doAdd;
  input.onkeydown = (e) => { if (e.key === 'Enter') doAdd(); };
  chips.appendChild(input); chips.appendChild(add);

  const current = numInt(it.packSize);
  const sizes = [...it.compareSizes].sort((a, b) => a - b);
  if (!sizes.length) { tbl.innerHTML = '<div class="hint">Add a pack size above to compare.</div>'; return; }

  const cols = sizes.map(s => ({ size: s, r: compute(atPackSize(it, s)) }));
  const valid = cols.filter(c => !c.r.error);
  const bestPerCase = valid.length ? Math.min(...valid.map(c => c.r.perCase)) : null;
  const pallets = num(it.casesPerPallet);

  const th = cols.map(c =>
    `<th class="${c.size === current ? 'cur' : ''}">Pack of ${c.size}${c.size === current ? ' ★' : ''}</th>`).join('');
  const row = (label, get, best) => `<tr><td>${label}</td>${cols.map(c => {
    if (c.r.error) return `<td class="${c.size === current ? 'cur' : ''}">—</td>`;
    const v = get(c.r);
    const isBest = best && v !== null && bestPerCase !== null && Math.abs(c.r.perCase - bestPerCase) < 1e-9;
    return `<td class="${c.size === current ? 'cur' : ''}${isBest ? ' best' : ''}">${v}</td>`;
  }).join('')}</tr>`;

  tbl.innerHTML = `<table>
    <thead><tr><th></th>${th}</tr></thead>
    <tbody>
      ${row('Packs per case', r => r.packsLabel ?? '—', false)}
      ${row('Cost per case', r => fmt(r.perCase), true)}
      ${row('Cost per pack', r => fmt(r.perPack), false)}
      ${row('Cost per unit', r => fmtUnit(r.perUnit), false)}
      ${pallets ? row('Cost per pallet', r => fmt(r.perPallet), false) : ''}
    </tbody>
  </table>
  <div class="hint" style="margin-top:6px">★ = currently selected pack size. Green = cheapest per case.</div>`;
}

// ---------- order total ----------
// One source for an order's money, used by the Order Total tab and the left bar.
function orderTotal(order) {
  let grand = 0, complete = 0;
  const rows = order.items.map(it => {
    const r = compute(it);
    const qty = orderedQty(it);
    const flag = r.error ? r.error : (!qty.cases ? 'Enter “cases in order” on this item’s tab.' : null);
    if (flag) return { it, flag };
    const total = r.perCase * qty.cases;
    grand += total; complete++;
    return { it, r, qty, total };
  });
  return { rows, grand, complete, allGood: complete === order.items.length };
}

const plural = (n, w) => n === 1 ? `1 ${w}` : `${n} ${w === 'box' ? 'boxes' : w + 's'}`;

// What the warehouse has to do for one item, as a short checklist with no
// prices. A cost box left blank means that step isn't done, so it isn't listed.
function prepSteps(it) {
  const r = compute(it);
  if (r.error) return [`${it.name} - not filled in yet`];
  const out = [it.soldByCase ? `${it.name} - sold by case` : `${it.name} - ${numInt(it.packSize)} pack`];
  const step = line => out.push('- ' + line);
  if (!it.soldByCase && num(it.bagCost) > 0) step('Bag');
  if (!it.soldByCase && num(it.labelCost) > 0) step('ASIN');
  if (num(it.caseLabelCost) > 0) step('Box label');
  if (!it.soldByCase && num(it.setStickerCost) > 0) step('Sold as set sticker');
  if (r.chosen) step(`Boxes: ${r.chosen.detail}`);   // uneven case pack: how the packs get boxed
  if (r.rebox) step(`Additional boxes (${r.rebox})`);
  return out;
}

function prepText(order) {
  const day = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const lines = [order.name.trim() ? `PREP: ${order.name.trim()} (${day})` : `PREP (${day})`, ''];
  order.items.forEach(it => lines.push(...prepSteps(it), ''));
  return lines.join('\n').trim();
}

function renderTotal() {
  const t = orderTotal(state);
  const rows = t.rows.map(x => x.flag
    ? `<tr><td>${esc(x.it.name)}</td><td>—</td><td>—</td><td class="flag">⚠ ${esc(x.flag)}</td></tr>`
    : `<tr><td>${esc(x.it.name)}</td><td>${esc(x.qty.label)}</td><td>${fmt(x.r.perCase)}</td><td><strong>${fmt(x.total)}</strong></td></tr>`).join('');
  const text = prepText(state);
  $panel.innerHTML = `
    <div class="tablewrap"><table>
      <thead><tr><th>Item</th><th>Quantity</th><th>Prep cost / case</th><th>Item total</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="grand">
      <span class="label">Order prep total${t.allGood ? '' : ' (complete items only)'}</span>
      <span class="amount">${fmt(t.grand)}</span>
    </div>
    <div class="prep">
      <div class="prep-h"><h3>Prep instructions</h3>
        <button class="add" onclick="copyText(document.getElementById('prepText').value, this)">Copy</button></div>
      <p class="hint">No prices. Paste into WhatsApp or email for the warehouse.</p>
      <textarea id="prepText" readonly rows="${text.split('\n').length + 1}">${esc(text)}</textarea>
    </div>`;
  renderSidebar();
}

// Only draws when the page is real; the release test loads this script with no page.
if (document.getElementById('panel')) render();
</script>
